<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box{
            width: 400px;
            background: white;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
        }

        .logo{
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            text-decoration: none;
            color: #222;
            display: inline-block;
        }

        h2{
            margin-bottom: 10px;
        }

        .subtitle{
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        label{
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .options{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .options a, .bottom a{
            text-decoration: none;
            color: #4169e1;
        }

        .remember{
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input{
            width: auto;
            margin: 0;
        }

        .login-btn{
            width: 100%;
            padding: 14px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-btn:hover{
            background-color: #444;
        }
        
        .bottom{
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            margin-bottom: 10px;
        }

       
       
        </style>
    </head>
    <body>


        <div class="login-box">
            <a href="practicing.html" class="logo">SHOP EASE</a>

            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your ShopEase account to continue shopping and manage your orders.
            </p>

            <form action="practicing.html">
                <label>Email address</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <p class="bottom">
                Don't have an account? 
                <a href="register.html" class="register-link">Register</a>
                <br>
                <a href="practicing.html" class="admin">Login as Admin</a>
            </p>
        </div>


    </body>
    </html>
